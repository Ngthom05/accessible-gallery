<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh có thể truy cập</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; }
        h1 { margin-bottom: 20px; color: #333; }
        #image { line-height: 300px; width: 500px; height: 300px; border: 4px solid #333; margin: 0 auto 30px auto; background-color: #cecece; background-repeat: no-repeat; background-size: cover; background-position: center; color: #222; font-size: 1.2rem; font-weight: bold; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .preview { width: 150px; height: 100px; border: 3px solid #ccc; border-radius: 6px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .preview:hover, .preview:focus { border-color: #0056b3; outline: 3px solid #ffbf47; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Thư Viện Ảnh Tương Tác Dễ Tiếp Cận</h1>

    <div id="image">Rê chuột hoặc nhấn Tab để xem ảnh ở đây.</div>

    <div class="gallery">
        <img class="preview" src="https://picsum.photos/id/1015/300/200" alt="Cảnh hồ nước và núi đồi xanh mát dưới ánh nắng" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1018/300/200" alt="Dãy núi đá hùng vĩ phủ đầy tuyết trắng" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1025/300/200" alt="Chú chó nhỏ đáng yêu đang cuộn tròn trong chăn" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1039/300/200" alt="Thành phố lung linh ánh đèn về đêm" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1043/300/200" alt="Rừng cây mùa thu với lá vàng rực rỡ" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="https://picsum.photos/id/1050/300/200" alt="Bãi biển hoang sơ với sóng vỗ rì rào" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

    <script>
        function initializeGallery() {
            console.log("Trang web đã tải xong!");
            let images = document.querySelectorAll(".preview");
            for (let i = 0; i < images.length; i++) {
                images[i].setAttribute("tabindex", "0");
            }
        }
        function upDate(previewPic) {
            console.log("Nguồn ảnh: " + previewPic.src);
            let displayBox = document.getElementById("image");
            displayBox.style.backgroundImage = "url('" + previewPic.src + "')";
            displayBox.innerHTML = previewPic.alt;
        }
        function unDo() {
            let displayBox = document.getElementById("image");
            displayBox.style.backgroundImage = "url('')";
            displayBox.innerHTML = "Rê chuột hoặc nhấn Tab để xem ảnh ở đây.";
        }
        window.onload = initializeGallery;
    </script>
</body>
</html>
